server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html index.htm;

  # Assets con hash: inmutables, cache largo
  location ~* \.(js|css)(\?.*)?$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Imágenes y fuentes: cache moderado
  location ~* \.(ico|png|jpg|jpeg|svg|gif|webp|woff|woff2|ttf|otf|eot)(\?.*)?$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # index.html nunca se cachea para que los nuevos hashes de build se apliquen
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files /index.html =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}